name: CI

# Runs on every push and pull request to staging and main. One job, because the
# PostgreSQL service it already needs for the migration steps is the same one
# the tests need.
#
# The migrate + drizzle-kit drift steps below are the schema guard: they prove
# the migrations apply to an empty database and that src/server/db/schema.ts has
# not drifted from them. The tests add what those two cannot see -- that the ORM
# can actually read and write every table against the migrated database, that
# the defaults and constraints declared in the schema exist in it, and that the
# environment validation refuses a bad configuration.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agtci_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d agtci_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/agtci_ci
      AUTH_SECRET: ci-only-secret-not-used-in-production
      # The schema tests read this, deliberately not DATABASE_URL: they drop
      # every table in whatever they are pointed at. Same database here because
      # CI's is disposable; locally the two must differ.
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/agtci_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations to a fresh database
        run: npm run db:migrate

      - name: Schema and migrations are in sync
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "src/server/db/schema.ts has changes with no migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Production build
        run: npm run build
