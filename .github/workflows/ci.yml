name: CI

# Runs on every push and pull request to staging and main: the standard suite
# from TEST_SPEC.md that needs no hosted service. Lint, typecheck, the
# database checks (migrations apply to an empty PostgreSQL and match
# schema.ts), the production build and a smoke run of it.
#
# The database is the PostgreSQL 16 service below. CI never connects to Neon,
# and no Neon URL or secret belongs in this file.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Docker Hub's official image, the one bkesari-platform's CI uses. This
        # was public.ecr.aws/docker/library/postgres:16 to dodge Docker Hub's
        # anonymous rate limit, until ECR Public refused every pull with "Data
        # limit exceeded" (2026-10-24). If Docker Hub's limit bites again,
        # mirror.gcr.io/library/postgres:16 is the next mirror to try.
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agtci_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d agtci_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/agtci_ci
      AUTH_SECRET: ci-only-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps and the other route types are generated, not committed.
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      # Applies the migrations to the empty service database (twice), compares
      # the result with schema.ts and the snapshot, and runs the behaviour probes.
      - name: Database checks
        run: node scripts/db-check.mjs

      # Without the database settings: nothing may connect to a database at
      # build time (the pool is created on the first request).
      - name: Production build
        run: env -u DATABASE_URL -u AUTH_SECRET npm run build

      - name: Smoke run
        run: node scripts/smoke.mjs --terminate
