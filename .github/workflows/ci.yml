name: CI

# Runs on every push and pull request to staging and main. There are no tests
# yet, so this guards what can break a deploy: database migrations that don't
# apply cleanly to PostgreSQL, lint errors and a failing production build
# (which also typechecks).
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The Docker Official Image via AWS's public mirror: pulls from Docker Hub
        # hit its anonymous rate limit on shared GitHub runners.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agtci_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d agtci_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/agtci_ci
      AUTH_SECRET: ci-only-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
